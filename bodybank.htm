<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODYBANK</title>

    <style>
        :root {
            --bg: #080b0d;
            --panel: #10161a;
            --panel2: #151d22;
            --text: #d7e2e5;
            --muted: #718087;
            --cyan: #37e0e8;
            --green: #75e68a;
            --red: #e86666;
            --yellow: #e6cf66;
            --border: #26363d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Courier New", monospace;
        }

        header {
            padding: 25px;
            border-bottom: 1px solid var(--border);
            background: #0b1013;
        }

        .logo {
            color: var(--cyan);
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 0.15em;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 6px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        input,
        select,
        button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            font-family: inherit;
        }

        input {
            flex: 1;
            min-width: 220px;
        }

        button {
            cursor: pointer;
            color: var(--cyan);
        }

        button:hover {
            background: var(--panel2);
            border-color: var(--cyan);
        }

        #status {
            color: var(--muted);
            margin-bottom: 15px;
        }

        .sleeves {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .sleeve {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 18px;
        }

        .sleeve:hover {
            border-color: var(--cyan);
        }

        .sleeve-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .sleeve-name {
            color: var(--cyan);
            font-size: 1.15rem;
            font-weight: bold;
        }

        .id {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .tag {
            display: inline-block;
            border: 1px solid var(--border);
            padding: 3px 6px;
            margin: 2px;
            font-size: 0.75rem;
            color: var(--green);
        }

        .details {
            margin-top: 15px;
            line-height: 1.6;
        }

        .label {
            color: var(--muted);
        }

        .availability {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .available {
            color: var(--green);
        }

        .unavailable {
            color: var(--red);
        }

        .restricted {
            color: var(--yellow);
        }

        .error {
            color: var(--red);
            border: 1px solid var(--red);
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">BODYBANK</div>
    <div class="subtitle">
        MORPHOLOGICAL ASSET REGISTRY // NODE: LOCAL
    </div>
</header>

<main>

    <div class="controls">
        <input
            type="text"
            id="search"
            placeholder="Search designation, type, purpose..."
        >

        <select id="typeFilter">
            <option value="all">ALL MORPH TYPES</option>
        </select>

        <select id="availabilityFilter">
            <option value="all">ALL STATUS</option>
            <option value="available">AVAILABLE</option>
            <option value="restricted">RESTRICTED</option>
            <option value="unavailable">UNAVAILABLE</option>
        </select>

        <button id="randomButton">RANDOM SLEEVE</button>
    </div>

    <div id="status">Connecting to Bodybank...</div>

    <div id="sleeves" class="sleeves"></div>

</main>

<script src="bodybank.js"></script>

</body>
</html>
