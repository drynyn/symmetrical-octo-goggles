name: Adjust bodybank bias

on:
  push:
    paths:
      - '.github/workflows/adjust-bias.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bodybank.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bodybank.js')
          s = p.read_text()
          s = s.replace('normalBias?.checked\n            ? 2.5\n            : 1', 'normalBias?.checked\n            ? 1.5\n            : 1')
          s = s.replace('\nnormalBias.addEventListener(\n    "change",\n    generateBodybank\n);\n', '\n')
          s = s.replace('AVAILABILITY = WEIGHT²·⁵', 'AVAILABILITY = WEIGHT¹·⁵')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bodybank.js
          git commit -m 'Reduce common morph bias to 1.5 and stop auto-regeneration' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/adjust-bias.yml
          git add .github/workflows/adjust-bias.yml
          git commit -m 'Remove temporary adjustment workflow'
          git push
