name: Build morph database from Eclipse Phase 2e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-morphs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install requests beautifulsoup4

      - name: Build morph database
        run: |
          python - <<'PY'
          import re
          import unicodedata
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          URLS = [
              ('Biomorph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/01-biomorphs.html'),
              ('Uplift Biomorph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/02-uplift-biomorphs.html'),
              ('Pod Biomorph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/03-pod-biomorphs.html'),
              ('Exomorph Biomorph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/04-exomorph-biomorphs.html'),
              ('Synthmorph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/05-synthmorphs.html'),
              ('Infomorph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/06-infomorphs.html'),
              ('Core Morph', 'https://eclipsephase.github.io/en/SUPP/02-CO/03/07-core-morphs.html'),
          ]

          EXPECTED = {
          'Biomorph': '''Alpiner|Aquanaut|Ariel|Bouncer|Bruiser|Cloud Skate|Crasher|Dvergr|Exalt|Faust|Flat|Freeman|Fury|Futura|Garuda|Ghost|Glider|Venusian Glider Variant|Grey|Hazer|Hibernoid|Hulder|Hyperbright|Imp|Menton|Neotenic|Nomad|Observer|Olympian|Remade|Ring Flyer|Ruster|Salamander|Selkie|Splicer|Surya|Nishakara Variant|Sylph|Theseus'''.split('|'),
          'Uplift Biomorph': '''Neo-Avian|Neo-Beluga|Neo-Bonobo/Neo-Chimp|Neo-Dolphin|Neo-Gorilla|Neo-Neanderthal|Neo-Octopus|Neo-Orangutan|Neo-Orca|Neo-Pig|Neo-Porpoise|Neo-Whale'''.split('|'),
          'Pod Biomorph': '''Augur|Ayah|Defender Variant|Basic Pod|Chickcharnie|Critter|Digger|Flying Squid|Hypergibbon|Novacrab|Pleasure Pod|Ripwing|Samsa|Security Pod|Space Marine Variant|Shaper|Traceur|Vac Pod|Worker Pod'''.split('|'),
          'Exomorph Biomorph': '''Scurrier|Quadruped Variant|Whiplash'''.split('|'),
          'Synthmorph': '''Arachnoid|Arachnikoma Variant|Biocore|Case|Cetus|Cloud Skimmer|Courier|Daitya|Combat Mech Variant|Dragonfly|Fenrir|Flexbot|Apiary Module|Aviary Module|Bard Module|Cleric Module|Conjurer Module|Crafter Module|Fighter Module|Rogue Module|Wizard Module|Galatea|Golem Variant|Gargoyle|Griefer|Guard|Prime Variant|Kite|Fierce Kite Variant|Ultra Kite Variant|Mimic|Nautiloid|Oobleck|Opteryx|Ornithope|Blackbird Variant|Q-Morph|Raptor|Reaper|Rover|Savant|Slitheroid|Smart Swarm|Spare|Sphere|Steel Morph|Liquid Silver Variant|Sundiver|Swarmanoid|Skulker Variant|Synth|Synthtaur|Takko|Xu Fu'''.split('|'),
          'Infomorph': '''Agent|Digimorph|Djinn|Echo|Ikon|Neo|Operator|Sage|Spectre'''.split('|'),
          'Core Morph': '''Overmind|Sexton|Warden'''.split('|'),
          }

          def clean(s):
              return re.sub(r'\s+', ' ', s.replace('\xa0', ' ')).strip()

          def slug(s):
              s = unicodedata.normalize('NFKD', s).encode('ascii', 'ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+', '-', s).strip('-') or 'morph'

          def split_items(text):
              parts, cur, depth = [], [], 0
              for ch in text:
                  if ch == '(':
                      depth += 1
                  elif ch == ')' and depth:
                      depth -= 1
                  if ch == ',' and depth == 0:
                      p = clean(''.join(cur))
                      if p: parts.append(p)
                      cur = []
                  else:
                      cur.append(ch)
              p = clean(''.join(cur))
              if p: parts.append(p)
              return parts

          def parse_availability(text):
              m = re.search(r'Avail:\s*(NA|\d+)', text, re.I)
              base = 0 if not m or m.group(1).upper() == 'NA' else int(m.group(1))
              conditions = []
              for val, place in re.findall(r'(\d+)\s+(?:in|on|at|around|within)\s+([^(),]+(?:/[^(),]+)?)', text[m.end():] if m else text, re.I):
                  place = clean(place).rstrip('.')
                  low = place.lower()
                  aliases = {
                      'mars': [('mars', 'Mars')], 'venus': [('venus', 'Venus')],
                      'titan': [('titan', 'Titan')], 'luna': [('luna', 'Luna')],
                      'saturn': [('saturn', 'Saturn')], 'jupiter': [('jupiter', 'Jupiter')],
                      'uranus': [('uranus', 'Uranus')], 'aquatic habs': [('aquatic', 'Aquatic Habitat')],
                      'aquatic habitat': [('aquatic', 'Aquatic Habitat')],
                      'micrograv habs': [('micrograv', 'Microgravity Habitats')],
                      'gate habs': [('gate', 'Gate Habitats')],
                      'gate habitats': [('gate', 'Gate Habitats')],
                  }
                  targets = aliases.get(low)
                  if targets is None and '/' in place and 'uranus' in low and 'jupiter' in low:
                      targets = [('uranus', 'Uranus'), ('jupiter', 'Jupiter')]
                  if targets is None:
                      targets = [(slug(place), place.title())]
                  for hid, name in targets:
                      conditions.append((hid, name, int(val)))
              # Preserve order and remove duplicates.
              seen = set(); out = []
              for item in conditions:
                  if item not in seen:
                      seen.add(item); out.append(item)
              return base, out

          def parse_entry(heading):
              # A morph entry is an h2 followed by its first blockquote before the next h2.
              for node in heading.find_all_next():
                  if node is not heading and getattr(node, 'name', None) == 'h2':
                      return None
                  if getattr(node, 'name', None) == 'blockquote':
                      data = {}
                      for li in node.find_all('li'):
                          t = clean(li.get_text(' ', strip=True))
                          if t.startswith('Cost:'):
                              cm = re.search(r'Cost:\s*(?:Rare\s*\(\s*)?(\d+)\s*MP', t, re.I)
                              if cm: data['cost'] = int(cm.group(1))
                              data['avail_text'] = t
                          elif t.startswith('WT:'):
                              sm = re.search(r'WT:\s*(\d+)\s*[•/]\s*DUR:\s*(\d+)\s*[•/]\s*DR:\s*(\d+)', t)
                              if sm: data['stats'] = tuple(map(int, sm.groups()))
                          elif t.startswith('Insight'):
                              am = re.search(r'Insight\s*(\d+),\s*Moxie\s*(\d+),\s*Vigor\s*(\d+),\s*Flex\s*(\d+)', t)
                              if am: data['aptitudes'] = tuple(map(int, am.groups()))
                          elif t.startswith('Movement Rate:'):
                              data['movement'] = t.split(':', 1)[1].strip()
                          elif t.startswith('Ware:'):
                              data['ware'] = t.split(':', 1)[1].strip()
                          elif t.startswith('Morph Traits:'):
                              data['traits'] = t.split(':', 1)[1].strip()
                          elif t.startswith('Common Extras:'):
                              data['extras'] = t.split(':', 1)[1].strip()
                          elif t.startswith('Notes:'):
                              data['notes'] = t.split(':', 1)[1].strip()
                      return data
              return None

          morphs = {}
          habitats = {
              'standard': 'Standard', 'scum': 'Scum Swarm', 'mars': 'Mars', 'aquatic': 'Aquatic Habitat',
              'saturn': 'Saturn', 'jupiter': 'Jupiter', 'venus': 'Venus', 'uranus': 'Uranus',
              'belt': 'Main Belt', 'gate': 'Gate / Uplift Habitat'
          }
          s = requests.Session(); s.headers['User-Agent'] = 'symmetrical-octo-goggles/2e-morph-import'

          for category, url in URLS:
              r = s.get(url, timeout=60); r.raise_for_status()
              soup = BeautifulSoup(r.text, 'html.parser')
              for h2 in soup.find_all('h2'):
                  name = clean(h2.get_text(' ', strip=True))
                  if name in {'Biomorphs','Uplift Biomorphs','Pod Biomorphs','Exomorph Biomorphs','Synthmorphs','Infomorphs','Core Morphs'}:
                      continue
                  data = parse_entry(h2)
                  if not data or 'cost' not in data or 'avail_text' not in data:
                      continue
                  base, conds = parse_availability(data['avail_text'])
                  for hid, hn, _ in conds: habitats[hid] = hn
                  morphs[name] = {
                      'id': slug(name), 'name': name, 'type': category, 'cost': data['cost'],
                      'avail': base, 'conditions': conds, 'stats': data.get('stats'),
                      'aptitudes': data.get('aptitudes'), 'movement': data.get('movement'),
                      'ware': data.get('ware'), 'traits': data.get('traits'),
                      'extras': data.get('extras'), 'notes': data.get('notes')
                  }

          expected = {n for names in EXPECTED.values() for n in names}
          found = set(morphs)
          missing = sorted(expected - found)
          unexpected = sorted(found - expected)
          if missing or unexpected or len(found) != 139:
              print('MISSING:', missing)
              print('UNEXPECTED:', unexpected)
              print('FOUND:', len(found))
              raise SystemExit('Guide verification failed')

          # Build XML. All 139 guide entries are retained. Flexbot modules have zero
          # availability because they are components, not standalone sleeves.
          root = ET.Element('bodybank')
          hs = ET.SubElement(root, 'habitats')
          for hid, hn in sorted(habitats.items()):
              h = ET.SubElement(hs, 'habitat', id=hid); ET.SubElement(h, 'name').text = hn
          ms = ET.SubElement(root, 'morphs')
          for e in sorted(morphs.values(), key=lambda x: (x['type'], x['name'].lower())):
              m = ET.SubElement(ms, 'morph', id=e['id'], name=e['name'], type=e['type'])
              ET.SubElement(m, 'cost').text = str(e['cost'])
              av = ET.SubElement(m, 'availability', base=str(0 if e['name'].endswith('Module') else e['avail']))
              for hid, hn, val in e['conditions']:
                  ET.SubElement(av, 'habitat', id=hid, value=str(val))
              if e['stats']:
                  st = ET.SubElement(m, 'stats')
                  for tag, val in zip(('wt','dur','dr'), e['stats']): ET.SubElement(st, tag).text = str(val)
              if e['aptitudes']:
                  ap = ET.SubElement(m, 'aptitudes')
                  for tag, val in zip(('insight','moxie','vigor','flex'), e['aptitudes']): ET.SubElement(ap, tag).text = str(val)
              if e['movement']:
                  mv = ET.SubElement(m, 'movement')
                  for part in split_items(e['movement']):
                      mm = re.match(r'(.+?)\s+(\d+)\/(\d+)$', part)
                      if mm: ET.SubElement(mv, 'rate', mode=mm.group(1), normal=mm.group(2), running=mm.group(3))
              for field, tag in [('ware','ware'),('traits','morphTraits'),('extras','commonExtras')]:
                  if e[field]:
                      p = ET.SubElement(m, tag)
                      for item in split_items(e[field]): ET.SubElement(p, 'item').text = item
              if e['notes']: ET.SubElement(m, 'notes').text = e['notes']
          ET.indent(root, space='    ')
          Path('morphs.xml').write_text(ET.tostring(root, encoding='unicode') + '\n', encoding='utf-8')
          print('Imported and verified 139 morph entries')
          PY

      - name: Verify XML and commit
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('morphs.xml').getroot()
          entries = root.find('morphs').findall('morph')
          names = [m.get('name') for m in entries]
          assert len(entries) == 139, len(entries)
          assert len(names) == len(set(names)), 'Duplicate names'
          print('Verified 139 unique morph XML entries')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add morphs.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expand morph database with complete Eclipse Phase 2e guide'
          git push
