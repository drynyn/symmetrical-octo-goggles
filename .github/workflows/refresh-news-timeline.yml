name: Refresh News Timeline data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news-timeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect RSS articles
        run: python scripts/refresh_news.py
      - name: Commit updated dataset
        run: |
          if git diff --quiet -- news-timeline/news.json; then
            echo "Dataset unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-timeline/news.json
          git commit -m "Refresh News Timeline data"
          git push
