name: Apply normal morph bias

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'normal morph bias patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('bodybank.htm').read_text()
          marker = '''                <button id="generate">\n                    GENERATE BODYBANK\n                </button>'''
          replacement = '''                <label for="normalBias">\n                    <input\n                        id="normalBias"\n                        type="checkbox"\n                    >\n                    <span>FAVOUR COMMON MORPHS</span>\n                </label>\n\n\n                <button id="generate">\n                    GENERATE BODYBANK\n                </button>'''
          if 'id="normalBias"' not in html:
              html = html.replace(marker, replacement, 1)
          Path('bodybank.htm').write_text(html)

          js = Path('bodybank.js').read_text()
          if 'document.getElementById("normalBias")' not in js:
              js = js.replace(
                  'const sleeveCount =\n    document.getElementById("sleeveCount");',
                  'const sleeveCount =\n    document.getElementById("sleeveCount");\n\nconst normalBias =\n    document.getElementById("normalBias");',
                  1
              )

          old = '''    const total =\n        items.reduce(\n            (sum, item) =>\n                sum + item.weight,\n            0\n        );'''
          new = '''    const exponent =\n        normalBias?.checked\n            ? 2.5\n            : 1;\n\n    const total =\n        items.reduce(\n            (sum, item) =>\n                sum + Math.pow(\n                    item.weight,\n                    exponent\n                ),\n            0\n        );'''
          js = js.replace(old, new, 1)

          old = '''        roll -= item.weight;'''
          new = '''        roll -= Math.pow(\n            item.weight,\n            exponent\n        );'''
          js = js.replace(old, new, 1)

          old = '''        //\n\n        COMMON EXTRAS = RANDOMISED'''
          new = '''        //\n\n        COMMON EXTRAS = RANDOMISED\n\n        //\n\n        NORMAL BIAS =\n        ${normalBias?.checked ? "ON" : "OFF"}'''
          js = js.replace(old, new, 1)

          old = '''resetButton.addEventListener(\n    "click",\n    reset\n);'''
          new = '''resetButton.addEventListener(\n    "click",\n    reset\n);\n\n\nnormalBias.addEventListener(\n    "change",\n    generateBodybank\n);'''
          js = js.replace(old, new, 1)

          Path('bodybank.js').write_text(js)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-normal-bias.yml
          git add bodybank.htm bodybank.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply normal morph bias patch"
          git push
